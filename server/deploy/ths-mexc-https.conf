# Port 443 on the MEXC gateway host. The certificate is issued to the IP address, so there is no server name.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/ths-mexc-tls/fullchain.pem;
    ssl_certificate_key /etc/ths-mexc-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    access_log off;
    include /etc/nginx/snippets/ths-mexc-locations.conf;
    location / {
        return 404;
    }
}
