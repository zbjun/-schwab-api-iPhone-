<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    THS app icon source: three glass candlesticks rising (red = up, green = down).
    icon.png is this file at 1024 px (opaque, square; iOS applies the corner mask).
    The Android, favicon and splash PNGs are made from the marked "background" and "mark" blocks:
    the mark is scaled around (512, 513) to fit the adaptive-icon safe zone, and monochrome is the
    wick and body shapes only.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D232D"/>
      <stop offset="1" stop-color="#0E1013"/>
    </linearGradient>
    <radialGradient id="glow" cx="780" cy="200" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3D8BFD" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#3D8BFD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="up" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8178"/>
      <stop offset="0.42" stop-color="#FF4A40"/>
      <stop offset="1" stop-color="#CF332D"/>
    </linearGradient>
    <linearGradient id="down" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63D98A"/>
      <stop offset="0.42" stop-color="#29BA59"/>
      <stop offset="1" stop-color="#12813F"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- background:start -->
  <g id="background">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="4">
      <line x1="0" y1="352" x2="1024" y2="352"/>
      <line x1="0" y1="512" x2="1024" y2="512"/>
      <line x1="0" y1="672" x2="1024" y2="672"/>
    </g>
  </g>
  <!-- background:end -->

  <!-- mark:start -->
  <g id="mark">
    <!-- decor:start -->
    <!-- soft coloured light under each body -->
    <g filter="url(#blur)" opacity="0.55">
      <rect x="196" y="606" width="172" height="214" rx="38" fill="#FF4A40"/>
      <rect x="426" y="470" width="172" height="220" rx="38" fill="#29BA59"/>
      <rect x="656" y="266" width="172" height="354" rx="38" fill="#FF4A40"/>
    </g>
    <!-- decor:end -->

    <!-- wicks -->
    <rect x="270" y="520" width="24" height="320" rx="12" fill="#E43C34"/>
    <rect x="500" y="392" width="24" height="332" rx="12" fill="#1E9E4B"/>
    <rect x="730" y="176" width="24" height="474" rx="12" fill="#E43C34"/>

    <!-- bodies -->
    <rect x="196" y="576" width="172" height="214" rx="38" fill="url(#up)"/>
    <rect x="426" y="440" width="172" height="220" rx="38" fill="url(#down)"/>
    <rect x="656" y="236" width="172" height="354" rx="38" fill="url(#up)"/>

    <!-- decor:start -->
    <!-- glass sheen and rim light -->
    <g>
      <rect x="209" y="587" width="146" height="90" rx="26" fill="url(#sheen)"/>
      <rect x="439" y="451" width="146" height="92" rx="26" fill="url(#sheen)"/>
      <rect x="669" y="247" width="146" height="149" rx="26" fill="url(#sheen)"/>
    </g>
    <g fill="none" stroke="url(#rim)" stroke-width="4">
      <rect x="198" y="578" width="168" height="210" rx="36"/>
      <rect x="428" y="442" width="168" height="216" rx="36"/>
      <rect x="658" y="238" width="168" height="350" rx="36"/>
    </g>
    <!-- decor:end -->
  </g>
  <!-- mark:end -->
</svg>
