# Include only inside the existing HTTPS server block. No new public HTTP port.
location = /rpc {
    include /etc/nginx/snippets/ths-gateway-proxy.conf;
}
location = /market {
    include /etc/nginx/snippets/ths-gateway-proxy.conf;
}
location = /oauth/callback {
    include /etc/nginx/snippets/ths-gateway-proxy.conf;
}
