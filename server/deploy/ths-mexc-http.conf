# Port 80 on the MEXC gateway host. Used only to prove control of the address for the certificate.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ths-mexc-acme;
        default_type text/plain;
    }
    # Device keys and orders never travel over plain HTTP, so there is nothing else to serve or redirect.
    location / {
        return 404;
    }
}
