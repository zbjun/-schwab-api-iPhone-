# Include only inside the HTTPS server block of the MEXC gateway's site. /rpc is the only route.
# Preserve Authorization AND Origin: the application rejects browser-origin requests, even with a key.
location = /rpc {
    proxy_pass http://127.0.0.1:8789;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 45s;
    proxy_send_timeout 30s;
    # Never let the proxy resend an order to another upstream.
    proxy_next_upstream off;
    proxy_cache off;
    proxy_request_buffering off;
    client_max_body_size 24k;
    client_body_timeout 10s;
    access_log off;
    error_log /dev/null crit;
}
