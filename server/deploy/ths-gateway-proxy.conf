# Shared by exact locations only. Preserve Authorization AND Origin: the
# application deliberately rejects browser-origin requests, even with a key.
proxy_pass http://127.0.0.1:8788;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_connect_timeout 5s;
proxy_read_timeout 75s;
proxy_send_timeout 30s;
proxy_next_upstream off;
proxy_cache off;
proxy_request_buffering off;
client_max_body_size 24k;
client_body_timeout 10s;
# Errors can contain the OAuth request URI too. Never log keys/callback queries.
access_log off;
error_log /dev/null crit;
